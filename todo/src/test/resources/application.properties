spring.datasource.url=jdbc:h2:mem:todo_shared_db;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
# JWT secret used by JwtUtility — must be present for the app context to load
jwt.secret=test-secret-key-that-is-long-enough-for-hs256-algorithm
spring.mvc.problemdetails.enabled=false